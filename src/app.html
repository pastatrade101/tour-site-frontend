<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon1.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#393D32" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Goldfinch" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Fonts are loaded without blocking the first paint.

      As a plain stylesheet this cost ~2.5s of render-blocking time on a
      throttled connection: nothing at all could paint until a DNS lookup, TLS
      handshake and fetch to a third-party origin had finished, which is why
      the first two frames of a Lighthouse filmstrip were blank white.

      `media="print"` makes the browser fetch it at low priority without
      blocking; onload promotes it to apply. The URL already carries
      display=swap, so text paints immediately in the fallback face and swaps
      when the webfont arrives — the same swap that happened before, just no
      longer holding up the entire page to do it.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'; this.onload=null;"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!--
      Google Consent Mode v2 defaults — must run before any Google tag loads.

      Where the visitor is decides whether we must ask first. In the EU/EEA,
      the UK and Switzerland the law requires opt-in, so everything starts
      denied and the cookie dialog asks. Elsewhere analytics and advertising
      measurement are on by default and can be switched off from "Cookie
      settings" in the footer (lib/consent.ts reads window.__gfConsentRegion).
      The browser's time zone stands in for the location; an unknown one asks.
      PUBLIC_CONSENT_ASK_EVERYWHERE=true asks every visitor.

      A saved choice (key gf_consent_v2) always wins. Personalised
      advertising is never granted.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag = window.gtag || function () { window.dataLayer.push(arguments); };
      (function () {
        var tz = '';
        try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) { tz = ''; }
        var askEverywhere = '%sveltekit.env.PUBLIC_CONSENT_ASK_EVERYWHERE%' === 'true';
        var optIn = askEverywhere || !tz || /^Europe\//.test(tz) ||
          /^(Atlantic\/(Canary|Madeira|Azores|Reykjavik|Faroe)|Arctic\/Longyearbyen|Indian\/(Reunion|Mayotte)|America\/(Guadeloupe|Martinique|Cayenne|St_Barthelemy|Marigot)|Asia\/(Nicosia|Famagusta))$/.test(tz);
        window.__gfConsentRegion = optIn ? 'opt_in' : 'opt_out';

        var c = null;
        try { c = JSON.parse(localStorage.getItem('gf_consent_v2') || 'null'); } catch (e) { c = null; }
        var ok = !!(c && c.v === 2 && c.expiresAt > Date.now());
        var analytics = ok ? c.analytics === true : !optIn;
        var marketing = ok ? c.marketing === true : !optIn;
        window.gtag('consent', 'default', {
          analytics_storage: analytics ? 'granted' : 'denied',
          ad_storage: marketing ? 'granted' : 'denied',
          ad_user_data: marketing ? 'granted' : 'denied',
          ad_personalization: 'denied',
          wait_for_update: 500
        });
        window.gtag('set', 'ads_data_redaction', !marketing);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Google Tag Manager (noscript) — only reached by visitors with JavaScript off;
         the script container itself is loaded by routes/+layout.svelte under Consent Mode v2. -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=%sveltekit.env.PUBLIC_GTM_ID%"
    height="0" width="0" style="display:none;visibility:hidden" title="Google Tag Manager"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
